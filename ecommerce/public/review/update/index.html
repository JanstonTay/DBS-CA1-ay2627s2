<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Update Review – HydroMax Shop</title>
  <link rel="stylesheet" href="/review/create/style.css"/>
</head>
<body>

  <nav class="navbar">
    <div class="nav-brand">
      <span class="nav-icon">💧</span>
      <span>HydroMax Shop</span>
    </div>
    <div class="nav-links">
      <span class="nav-welcome">Welcome, <strong id="navUsername">User</strong></span>
      <a href="/product/retrieve" class="nav-link">Products</a>
      <a href="/review/retrieve/all" class="nav-link">My Reviews</a>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
  </nav>

  <div class="page-header">
    <h1>Update Review</h1>
    <p>Change the rating or text of your review</p>
  </div>

  <main class="main-content">
    <div class="form-card">
      <div id="message" class="message hidden"></div>

      <form id="reviewForm" novalidate>
        <div class="form-group">
          <span class="form-label">Product</span>
          <p id="productName"></p>
        </div>

        <div class="form-group">
          <span class="form-label">Rating</span>
          <div class="star-rating">
            <input type="radio" id="star5" name="rating" value="5"/><label for="star5">★</label>
            <input type="radio" id="star4" name="rating" value="4"/><label for="star4">★</label>
            <input type="radio" id="star3" name="rating" value="3"/><label for="star3">★</label>
            <input type="radio" id="star2" name="rating" value="2"/><label for="star2">★</label>
            <input type="radio" id="star1" name="rating" value="1"/><label for="star1">★</label>
          </div>
        </div>

        <div class="form-group">
          <label for="reviewText">Your review</label>
          <textarea id="reviewText" class="form-input" rows="6"></textarea>
        </div>

        <div class="form-actions">
          <a href="/review/retrieve/all" class="btn-secondary">Cancel</a>
          <button type="submit" class="btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </main>

  <footer class="footer">
    <p>© 2025 HydroMax Shop · ST0525 Database Systems CA1</p>
  </footer>

  <script src="/review/update/script.js"></script>
</body>
</html>
